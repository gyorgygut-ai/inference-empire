[project]
name = "realtime-voice"
version = "0.1.0"
description = "Realtime Voice workers"
requires-python = ">=3.11"
dependencies = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "transformers==4.51.3",
    "accelerate",
    "bitsandbytes",
    "faster-whisper",
    "TTS",
    "soundfile",
    "numpy",
    "fastapi",
    "uvicorn",
    "hf_transfer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ty",
]
