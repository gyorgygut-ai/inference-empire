[cerebrium.deployment]
name = "worker-llm"
python_version = "3.11"
disable_auth = true # The FastAPI worker validates the LLM API Bearer token.
include = ["./*", "main.py", "worker_llm_chat_completions_cerebrium.py", "cerebrium.toml", "shared/**/*", "dist/**/*"]
exclude = [".*", "__pycache__/*", "*.pyc", ".venv", ".venv/**", "fakes/*", "tests/*"]
use_uv = true
deployment_initialization_timeout = 800

[cerebrium.runtime.custom]
port = 8000
entrypoint = ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
healthcheck_endpoint = "/health"
readycheck_endpoint = "/health"

[cerebrium.hardware]
cpu = 4
memory = 32.0
compute = "AMPERE_A10"
gpu_count = 1

[cerebrium.scaling]
min_replicas = 0
max_replicas = 1
replica_concurrency = 1
scaling_metric = "concurrency_utilization"
scaling_target = 100
cooldown = 60
compute_tier = "interruptible"

[cerebrium.dependencies.pip]
fastapi = "==0.141.1"
uvicorn = "==0.35.0"
torch = "==2.6.0"
transformers = "==5.2.0"
accelerate = "==1.15.0"
huggingface-hub = "==1.29.0"
hf-transfer = "==1.1.0"
bitsandbytes = "==0.50.2"
