[project]
name = "workers-voice"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiortc==1.15.0",
    "av==17.1.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "numpy==2.4.3",
    "python-dotenv==1.2.4",
    "speech-to-speech[webrtc]==1.1.0",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
# Provider CLIs live here, not in the root venv: each provider CLI imports the
# entry file in its own interpreter, which must therefore hold aiortc/av.
dev = [
    "beam-client==0.2.207",
    "modal==1.5.5",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "local_e2e: end-to-end against the local proof worker",
]
