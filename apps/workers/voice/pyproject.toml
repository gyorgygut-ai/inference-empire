[project]
name = "worker-voice"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.141.1",
    "fastrtc[vad]==0.0.34",
    "httpx==0.28.1",
    "numpy==2.4.3",
    "python-multipart==0.0.32",
    "soundfile==0.14.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.2", "ty==0.0.1a30"]

[tool.uv]
package = false

[tool.uv.sources]
fastrtc = { git = "https://github.com/gradio-app/fastrtc", rev = "59ca4f77e1669a9599c0895fd0d7c39f356bf89f" }

[tool.pytest.ini_options]
pythonpath = ["."]
