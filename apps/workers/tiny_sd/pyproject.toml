[project]
name = "workers-tiny_sd"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.9.1",
    "transformers==5.16.1",
    "accelerate==1.14.0",
    "diffusers==0.40.0",
    "safetensors==0.8.0",
    "huggingface-hub==1.29.0",
    "pillow==12.3.0",
    "boto3==1.43.83",
    "fastapi[standard]==0.141.1",
    "hf_transfer==0.1.9",
]

[tool.uv.sources]
shared-gpu = { path = "../../../packages/workers/shared_gpu" }
artifacts = { path = "../../../packages/workers/artifacts" }
media = { path = "../../../packages/workers/media" }
modal-bridge = { path = "../../../packages/workers/modal_bridge" }
