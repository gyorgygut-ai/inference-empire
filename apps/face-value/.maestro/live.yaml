url: http://localhost:3000
---
- launchApp
- extendedWaitUntil:
    visible: "Select an outcome to transform your face"
    timeout: 10000
- assertTrue: "document.readyState === 'complete'"
- tapOn: "Your celebrity selfie"
- tapOn: "Upload a reference image"
- evalScript: |
    const input = document.querySelector('input[type="file"]');
    const dataTransfer = new DataTransfer();
    const file = new File([await fetch('./apps/face-value/01-initial.png').then(r => r.arrayBuffer())], '01-initial.png', { type: 'image/png' });
    dataTransfer.items.add(file);
    input.files = dataTransfer.files;
    input.dispatchEvent(new Event('change', { bubbles: true }));
- extendedWaitUntil:
    visible: "Generate"
    timeout: 5000
- tapOn: "Generate"
- extendedWaitUntil:
    visible: "Generating…"
    timeout: 5000
- repeat:
    times: 10
    commands:
      - evalScript: |
          const ps = Array.from(document.querySelectorAll('p'));
          output.done = ps.some(p => p.textContent.includes('Done'));
          output.rejected = ps.some(p => p.textContent.includes('Generation rejected'));
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      true: ${output.done === true}
    commands:
      - assertVisible: "Download"
- runFlow:
    when:
      true: ${output.rejected === true}
    commands:
      - assertVisible: "Generation rejected"