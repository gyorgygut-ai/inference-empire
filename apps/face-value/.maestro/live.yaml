url: http://localhost:3000
---
- launchApp
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "[aria-labelledby='selectOutcome']"
    timeout: 10000
- assertTrue: "document.readyState === 'complete'"
- tapOn: "[aria-labelledby='outcomeCelebritySelfie']"
- tapOn: "[aria-labelledby='uploadReference']"
- evalScript: |
    const input = document.querySelector('input[type="file"]');
    const dataTransfer = new DataTransfer();
    const file = new File([await fetch('./apps/face-value/01-initial.png').then(r => r.arrayBuffer())], '01-initial.png', { type: 'image/png' });
    dataTransfer.items.add(file);
    input.files = dataTransfer.files;
    input.dispatchEvent(new Event('change', { bubbles: true }));
- extendedWaitUntil:
    visible: "[aria-labelledby='requestInference']"
    timeout: 5000
- tapOn: "[aria-labelledby='requestInference']"
- extendedWaitUntil:
    visible: "[aria-labelledby='statusWorking']"
    timeout: 5000
- repeat:
    times: 12
    commands:
      - extendedWaitUntil:
          visible: "[aria-labelledby='resultDownload']"
          timeout: 3000
      - evalScript: |
          output.seen = !!document.querySelector('[aria-labelledby=\"resultDownload\"]');
- runFlow:
    when:
      true: ${output.seen === true}
    commands:
      - assertVisible: "[aria-labelledby='resultDownload']"
- runFlow:
    when:
      true: ${output.seen !== true}
    commands:
      - assertVisible: "[aria-labelledby='errorRejected']"
