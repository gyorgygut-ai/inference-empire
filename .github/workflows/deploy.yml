name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          cache-dependency-glob: "uv.lock"
          ignore-nothing-to-cache: true
      - run: npm ci
      - name: Write Vercel project link file
        run: |
          mkdir -p apps/face-value/.vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > apps/face-value/.vercel/project.json
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      - run: npx nx affected -t test-unit,lint,typecheck,verify-deploy-gate --base=origin/main~1
      - run: npm run deploy:affected
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}