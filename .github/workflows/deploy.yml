name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

      FLUX2_ROUTER_VERCEL_TOKEN: ${{ secrets.FLUX2_ROUTER_VERCEL_TOKEN }}
      FLUX2_ROUTER_VERCEL_ORG_ID: ${{ secrets.FLUX2_ROUTER_VERCEL_ORG_ID }}
      FLUX2_ROUTER_VERCEL_PROJECT_ID: ${{ secrets.FLUX2_ROUTER_VERCEL_PROJECT_ID }}

      KREA2_ROUTER_VERCEL_TOKEN: ${{ secrets.KREA2_ROUTER_VERCEL_TOKEN }}
      KREA2_ROUTER_VERCEL_ORG_ID: ${{ secrets.KREA2_ROUTER_VERCEL_ORG_ID }}
      KREA2_ROUTER_VERCEL_PROJECT_ID: ${{ secrets.KREA2_ROUTER_VERCEL_PROJECT_ID }}

      FACE_VALUE_VERCEL_TOKEN: ${{ secrets.FACE_VALUE_VERCEL_TOKEN }}
      FACE_VALUE_VERCEL_ORG_ID: ${{ secrets.FACE_VALUE_VERCEL_ORG_ID }}
      FACE_VALUE_VERCEL_PROJECT_ID: ${{ secrets.FACE_VALUE_VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          cache-dependency-glob: "uv.lock"
          ignore-nothing-to-cache: true
      - run: npm ci
      - run: npx nx affected -t test-unit,lint,typecheck,validate-deps --base=origin/main~1 --head=HEAD
      - run: npx nx affected -t deploy --base=origin/main~1 --head=HEAD --configuration=deploy
