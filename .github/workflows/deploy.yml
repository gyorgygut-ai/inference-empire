name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_PROXY_KEY: ${{ secrets.MODAL_PROXY_KEY }}
      MODAL_PROXY_SECRET: ${{ secrets.MODAL_PROXY_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          cache-dependency-glob: "uv.lock"
          ignore-nothing-to-cache: true
      - run: npm ci
      - name: Write Vercel project link file
        run: |
          mkdir -p apps/face-value/.vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > apps/face-value/.vercel/project.json
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      - name: Write worker .env file
        run: |
          printf 'HF_TOKEN=%s\nR2_ACCESS_KEY=%s\nR2_SECRET_KEY=%s\nR2_ENDPOINT=%s\nR2_BUCKET=%s\nMODAL_TOKEN_ID=%s\nMODAL_TOKEN_SECRET=%s\nMODAL_PROXY_KEY=%s\nMODAL_PROXY_SECRET=%s\n' "$HF_TOKEN" "$R2_ACCESS_KEY" "$R2_SECRET_KEY" "$R2_ENDPOINT" "$R2_BUCKET" "$MODAL_TOKEN_ID" "$MODAL_TOKEN_SECRET" "$MODAL_PROXY_KEY" "$MODAL_PROXY_SECRET" > .env
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_PROXY_KEY: ${{ secrets.MODAL_PROXY_KEY }}
          MODAL_PROXY_SECRET: ${{ secrets.MODAL_PROXY_SECRET }}
      - run: npx nx affected -t test-unit,lint,typecheck,validate-deps --base=origin/main~1
      - run: npx nx affected -t deploy --base=origin/main~1
      - run: npx nx run face-value:deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}