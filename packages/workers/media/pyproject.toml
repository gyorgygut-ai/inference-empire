[project]
name = "media"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "Media validation helpers"
dependencies = ["pillow"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["media"]
package-dir = { "media" = "." }
