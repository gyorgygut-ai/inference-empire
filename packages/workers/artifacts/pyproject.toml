[project]
name = "artifacts"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "Artifact storage helpers"
dependencies = ["boto3"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["artifacts"]
package-dir = { "artifacts" = "." }
