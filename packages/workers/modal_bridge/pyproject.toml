[project]
name = "modal-bridge"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "Reusable Modal HTTP bridge"
dependencies = ["modal", "fastapi"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["modal_bridge"]
package-dir = { "modal_bridge" = "." }
