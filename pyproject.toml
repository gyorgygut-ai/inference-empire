[project]
name = "cloud-workers"
version = "0.1.0"
description = "Unified AI worker monorepo"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beam-client==0.2.207",
    "boto3==1.43.89",
    "modal==1.5.5",
    "pydantic==2.13.5",
    "runpod-flash==1.7.0",
]

# Production model deps (torch/transformers/diffusers per-model pins) stay
# inline in worker files per workers/AGENTS.md — never add them here, or the
# Krea2 (transformers<5/diffusers 0.39) vs Flux2 (transformers>=5/diffusers 0.40)
# matrix conflicts in one resolver. This lockfile covers local/fake/tiny + dev only.

[dependency-groups]
dev = [
    "numpy==2.4.6",
    "pillow==12.3.0",
    "pytest==9.1.1",
    "ruff==0.16.6",
    "ty==0.0.78",
    "vulture==2.14",
]
test = [
    "accelerate==1.12.0",
    "diffsynth[audio]==2.1.6",
    "diffusers==0.39.0",
    "fastapi==0.141.1",
    "faster-qwen3-tts==0.3.2",
    "faster-whisper==1.2.1",
    "huggingface-hub==0.36.2",
    "safetensors==0.8.0",
    "soundfile==0.14.0",
    "torch==2.14.0",
    "transformers==4.57.3",
    "uvicorn==0.52.4",
]

[tool.setuptools.packages.find]
where = [".", "workers"]
include = ["workers*", "apps*", "apps.*", "packages.media", "packages.shared_gpu.artifacts"]

[tool.setuptools.package-dir]
"packages.shared_gpu" = "packages/shared-gpu"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["workers"]
markers = [
    "local_e2e: end-to-end against canned fakes, in-process",
    "deployed_e2e: end-to-end against the test-env deployment",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["packages/shared-gpu"]

[tool.ruff.lint]
select = ["F", "E1", "E4", "E7", "W", "I", "N", "UP", "ARG", "RET", "PLC", "PLE", "TC", "PTH", "PERF", "RUF"]
ignore = [
    "ARG001",
    "ARG002",
    "ARG003",
    "ARG004",
    "N806",
    "PLR0913",
    "PLW0603",
    "PTH118",
    "PTH120",
    "PTH122",
    "UP037",
    "PLC0415",
    "PTH",
    "RET504",
]

[tool.ty.analysis]
# GPU-only deps live in worker images (IMAGE_PIP_DEPS), never in the local
# venv. Silence unresolvable imports for exactly these modules; everything
# else (PIL, numpy, boto3, apps.*) stays a hard error.
allowed-unresolved-imports = ["torch.**", "diffusers.**", "transformers.**", "diffsynth.**", "huggingface_hub.**", "fastrtc.**"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.terminal]
error-on-warning = false

[[tool.ty.overrides]]
include = ["apps/**/tests/**", "apps/**/test_*.py"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "warn"
unresolved-attribute = "ignore"
not-iterable = "ignore"

[[tool.ty.overrides]]
include = ["apps/**/_shared_*.py", "packages/media/**/*.py", "packages/shared_gpu/artifacts/**/*.py", "tools/seed-volumes/seed-volumes.py"]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-return-type = "ignore"

[tool.vulture]
min_confidence = 90
exclude = [
    ".venv",
    "node_modules",
    "apps/**/node_modules",
    "tools/**/node_modules",
    "packages/**/node_modules",
    "dist",
    "tmp",
    "hf-cache",
    "cloud_workers.egg-info",
    ".pytest_cache",
    ".ruff_cache",
    ".git",
    ".nx",
    "__pycache__",
    "*.egg-info",
]
