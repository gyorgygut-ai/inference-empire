[project]
name = "cloud-workers"
version = "0.1.0"
description = "Unified AI worker monorepo"
requires-python = ">=3.11"
dependencies = [
    "runpod-flash",
    "beam-client",
    "modal",
    "pydantic>=2.0",
]

[project.optional-dependencies]
storage = [
    "boto3",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]
test = [
    "torch>=2.0",
    "transformers>=4.57,<5",
    "diffsynth[audio]",
    "numpy",
    "pillow",
    "boto3",
    "faster-whisper",
    "faster-qwen3-tts",
    "soundfile",
    "modal==1.5.5",
    "beam-client==0.2.207",
    "runpod-flash==1.7.0",
]

[tool.setuptools.packages.find]
where = ["workers"]
include = ["workers*"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
